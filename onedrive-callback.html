<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OneDrive Callback</title>
</head>
<body>
    <script>
        // Reenviar el codigo de autorizacion a la app via postMessage
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        if (error) {
            document.body.innerHTML = `
                <h1>Error de autorización</h1>
                <p>${urlParams.get('error_description') || 'Error desconocido'}</p>
                <p>Puedes cerrar esta ventana.</p>
            `;
        } else if (code) {
            document.body.innerHTML = `
                <h1>✅ Autorización exitosa</h1>
                <p>Conectando... esta ventana se cerrará sola.</p>
            `;
            if (window.opener) {
                window.opener.postMessage({ type: 'onedrive-auth', code: code }, window.location.origin);
                setTimeout(() => window.close(), 800);
            }
        } else {
            document.body.innerHTML = `
                <h1>Error</h1>
                <p>No se recibió código de autorización.</p>
                <p>Puedes cerrar esta ventana.</p>
            `;
        }
    </script>
</body>
</html>
