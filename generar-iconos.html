<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Iconos - CONSTRURAMSA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #090a0f;
            color: #f3f4f6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background: rgba(20, 24, 35, 0.45);
            border: 1px solid rgba(0, 164, 228, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(135deg, #004B93, #00A4E4);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            padding: 12px 24px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            transform: scale(1.05);
        }
        .preview {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .icon-preview {
            text-align: center;
        }
        canvas {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #00A4E4;">Generador de Iconos PWA</h1>
        <p>Esta herramienta genera los iconos necesarios para la instalación de la aplicación como PWA.</p>
        
        <button onclick="generarIcono(192)">Generar Icono 192x192</button>
        <button onclick="generarIcono(512)">Generar Icono 512x512</button>
        <button onclick="generarIcono(任意)">Generar Icono Principal</button>
        
        <div class="preview">
            <div class="icon-preview">
                <h3>192x192</h3>
                <canvas id="canvas-192" width="192" height="192"></canvas>
                <br>
                <button onclick="descargarIcono(192)">Descargar</button>
            </div>
            <div class="icon-preview">
                <h3>512x512</h3>
                <canvas id="canvas-512" width="512" height="512"></canvas>
                <br>
                <button onclick="descargarIcono(512)">Descargar</button>
            </div>
        </div>
    </div>

    <script>
        function dibujarIcono(canvas, tamaño) {
            const ctx = canvas.getContext('2d');
            
            // Fondo
            ctx.fillStyle = '#090a0f';
            ctx.fillRect(0, 0, tamaño, tamaño);
            
            // Texto principal
            ctx.fillStyle = '#00A4E4';
            ctx.font = `bold ${tamaño * 0.15}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CONSTRURAMSA', tamaño / 2, tamaño * 0.45);
            
            // Texto secundario
            ctx.fillStyle = '#6F2DBD';
            ctx.font = `${tamaño * 0.08}px Arial`;
            ctx.fillText('Control de Obra', tamaño / 2, tamaño * 0.6);
            
            // Decoración
            ctx.strokeStyle = '#00A4E4';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(tamaño * 0.2, tamaño * 0.7);
            ctx.lineTo(tamaño * 0.8, tamaño * 0.7);
            ctx.stroke();
        }
        
        function generarIcono(tamaño) {
            const canvas = document.getElementById(`canvas-${tamaño}`);
            if (canvas) {
                dibujarIcono(canvas, tamaño);
            }
        }
        
        function descargarIcono(tamaño) {
            const canvas = document.getElementById(`canvas-${tamaño}`);
            const link = document.createElement('a');
            link.download = `icon-${tamaño}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Generar iconos al cargar la página
        window.onload = function() {
            generarIcono(192);
            generarIcono(512);
        };
    </script>
</body>
</html>
