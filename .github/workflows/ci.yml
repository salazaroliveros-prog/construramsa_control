name: CI

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Un solo run a la vez por rama: si un run queda colgado, el siguiente push
# lo cancela en lugar de dejarlo corriendo 6 horas.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=high || true
      - name: Check for outdated dependencies
        run: npm outdated || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check Prettier formatting
        run: npm run format:check

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          node -e "JSON.parse(require('fs').readFileSync('construramsa_db.json','utf8')); console.log('DB JSON OK')"
      - run: |
          node -e "['sw.js','src/config.js','src/reportDataAdapter.js','src/kpiEngine.js','src/exportador.js','src/reporteEjecutivo.js','src/nominaEngine.js','src/plantillaPremium.js','src/signatureCapture.js','src/backgroundSync.js','src/syncOptimizer.js','src/silentDownload.js','src/formValidator.js','src/types.js'].forEach(f=>{try{new Function(require('fs').readFileSync(f,'utf8'));console.log(f+': OK')}catch(e){console.error(f+': SYNTAX ERROR: '+e.message);process.exit(1);}})"
      - name: Run npm test
        # La cadena `npm test` se ejecuta sub-test por sub-test para poder:
        # 1) imprimir un banner de progreso (si algo se cuelga, el resumen de
        #    diagnostico muestra exactamente que sub-test lo hizo), y
        # 2) limitar cada sub-test a 5 min (timeout 124) para que un cuelgue
        #    falle rapido en vez de ocupar el runner 6 horas.
        # El archivo npm-test.log se conserva para el artefacto/resumen.
        run: |
          set -o pipefail
          : > npm-test.log
          mapfile -t STEPS < <(node -p "require('./package.json').scripts.test.split('&&').map(s => s.trim()).join('\n')")
          echo "Sub-tests en la cadena: ${#STEPS[@]}" | tee -a npm-test.log
          exit_code=0
          for s in "${STEPS[@]}"; do
            echo "########## INICIO: $s ##########" | tee -a npm-test.log
            # Importante: NO usar un pipe en vivo con `tee`. Si timeout deja
            # procesos huerfanos (node/chrome) con el stdout heredado, el pipe
            # no cerraria nunca y el step se colgaria. Se redirige a step.out
            # y se vuelca al log despues de que timeout retorne.
            timeout --kill-after=30s 600 $s > step.out 2>&1
            rc=$?
            tee -a npm-test.log < step.out
            echo "########## FIN: $s (rc=$rc) ##########" | tee -a npm-test.log
            if [ "$rc" -ne 0 ]; then exit_code=$rc; break; fi
          done
          echo "CHAIN_EXIT=$exit_code" | tee -a npm-test.log
          exit "$exit_code"
      - name: Diagnostico de fallo (resumen + artefacto)
        if: failure()
        run: |
          {
            echo "## npm test fallo (commit ${GITHUB_SHA::7})"
            echo '```'
            echo "--- ultimas 250 lineas ---"
            tail -n 250 npm-test.log || echo "(sin npm-test.log)"
            echo "--- lineas con fail/error ---"
            grep -n -i -E 'fail|error|✖|not ok|✗' npm-test.log | tail -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -n -i -E 'fail|error|✖|not ok|✗' npm-test.log | tail -n 40 | while IFS= read -r l; do
            echo "::error::npm-test: $l"
          done || true
      - name: Subir log de npm test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-test-log
          path: npm-test.log
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security, lint, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest
      - name: Vincular proyecto Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel link --yes --project=construramsacontrolgastos --scope=proyectoswm
          vercel whoami --scope=proyectoswm
      - name: Deploy a produccion con token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Proyecto ya vinculado en el paso anterior; el deploy es bloqueante
          # y devuelve la URL al terminar.
          vercel deploy --prod --yes > deploy.log 2>&1
          EXIT_CODE=$?
          tail -20 deploy.log || true
          NEW_URL=$(grep -oE "https://construramsacontrolgastos[a-z0-9-]*\.vercel\.app" deploy.log | head -1 || true)
          if [ $EXIT_CODE -ne 0 ] || [ -z "$NEW_URL" ]; then
            echo "ERROR: el deploy fallo (exit $EXIT_CODE, url: $NEW_URL)"
            cat deploy.log
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$NEW_URL")
          echo "Deployment: $NEW_URL -> HTTP $STATUS"
          if [[ "$STATUS" =~ ^[23][0-9]{2}$ ]]; then
            echo "Deploy de produccion verificado correctamente"
          else
            echo "ERROR: deployment no responde (HTTP $STATUS)"
            exit 1
          fi
          # Alias legacy "construramsacontrolgastos.vercel.app": Vercel no
          # permite registrarlo como dominio de proyecto via CLI (*.vercel.app
          # rechazado), asi que se reapunta manualmente a cada nuevo deploy
          # para que el dominio de produccion siga los deploys automaticos.
          if vercel alias set "$NEW_URL" construramsacontrolgastos.vercel.app --token="$VERCEL_TOKEN" --scope=proyectoswm; then
            echo "Alias construramsacontrolgastos.vercel.app -> $NEW_URL"
          else
            echo "::warning::No se pudo actualizar el alias construramsacontrolgastos.vercel.app"
          fi
