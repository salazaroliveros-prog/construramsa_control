name: CI

"on":
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          node -e "JSON.parse(require('fs').readFileSync('construramsa_db.json','utf8')); console.log('DB JSON OK')"
      - run: |
          node -e "['sw.js','src/config.js','src/reportDataAdapter.js','src/kpiEngine.js','src/exportador.js','src/reporteEjecutivo.js','src/nominaEngine.js','src/plantillaPremium.js','src/signatureCapture.js','src/backgroundSync.js','src/syncOptimizer.js','src/silentDownload.js','src/types.js'].forEach(f=>{try{new Function(require('fs').readFileSync(f,'utf8'));console.log(f+': OK')}catch(e){console.error(f+': SYNTAX ERROR: '+e.message);process.exit(1);}})"
      - run: npm test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest
      - name: Vincular proyecto Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel link --yes --project=construramsacontrolgastos --scope=proyectoswm
          vercel whoami --scope=proyectoswm
      - name: Deploy a produccion con token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Proyecto ya vinculado en el paso anterior; el deploy es bloqueante
          # y devuelve la URL al terminar.
          vercel deploy --prod --yes > deploy.log 2>&1
          EXIT_CODE=$?
          tail -20 deploy.log || true
          NEW_URL=$(grep -oE "https://construramsacontrolgastos[a-z0-9-]*\.vercel\.app" deploy.log | head -1 || true)
          if [ $EXIT_CODE -ne 0 ] || [ -z "$NEW_URL" ]; then
            echo "ERROR: el deploy fallo (exit $EXIT_CODE, url: $NEW_URL)"
            cat deploy.log
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$NEW_URL")
          echo "Deployment: $NEW_URL -> HTTP $STATUS"
          if [[ "$STATUS" =~ ^[23][0-9]{2}$ ]]; then
            echo "Deploy de produccion verificado correctamente"
          else
            echo "ERROR: deployment no responde (HTTP $STATUS)"
            exit 1
          fi
