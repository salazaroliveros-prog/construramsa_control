name: CI

"on":
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          node -e "JSON.parse(require('fs').readFileSync('construramsa_db.json','utf8')); console.log('DB JSON OK')"
      - run: |
          node -e "['sw.js','src/config.js','src/reportDataAdapter.js','src/kpiEngine.js','src/exportador.js','src/reporteEjecutivo.js','src/nominaEngine.js','src/plantillaPremium.js','src/signatureCapture.js','src/backgroundSync.js','src/syncOptimizer.js','src/silentDownload.js','src/types.js'].forEach(f=>{try{new Function(require('fs').readFileSync(f,'utf8'));console.log(f+': OK')}catch(e){console.error(f+': SYNTAX ERROR: '+e.message);process.exit(1);}})"
      - run: npm test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy a produccion con token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Ejecutar el deploy en segundo plano y verificar el resultado via API,
          # para evitar el cuelgue del event stream del CLI
          vercel deploy --prod --yes --name=construramsa_control_gastos --scope=proyectoswm --token="$VERCEL_TOKEN" > deploy.log 2>&1 &
          VPID=$!
          echo "Deploy disparado (PID $VPID). Esperando resultado..."
          NEW_URL=""
          for i in $(seq 1 60); do
            kill -0 $VPID 2>/dev/null || break
            # Capturar la URL del deployment apenas aparezca en el log
            if [ -z "$NEW_URL" ]; then
              NEW_URL=$(grep -oE "https://construramsacontrolgastos-[a-z0-9]+-proyectoswm\.vercel\.app" deploy.log | head -1 || true)
            fi
            sleep 10
          done
          # Si el CLI sigue vivo tras 10 min, es el bug del event stream; el deployment ya existe
          if kill -0 $VPID 2>/dev/null; then
            kill $VPID 2>/dev/null || true
            echo "CLI no finalizo (bug de event stream). Verificando deployment via HTTP..."
          fi
          tail -20 deploy.log || true
          if [ -z "$NEW_URL" ]; then
            echo "ERROR: no se obtuvo URL del deployment"
            cat deploy.log
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$NEW_URL")
          echo "Deployment: $NEW_URL -> HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Deploy de produccion verificado correctamente"
          else
            echo "ERROR: deployment no responde (HTTP $STATUS)"
            exit 1
          fi
